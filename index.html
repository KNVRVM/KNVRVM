<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Мой сайт</title>
  <style>
    body {
      text-align: center;
      background: #f5f5f5;
      padding: 40px;
    }
    h1 {
      font-size: 48px;
    }
    p {
      font-size: 24px;
    }
    img {
      max-width: 500px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
<h1>Привет!</h1>
<p id="tekst"></p>
<img id="foto" src="photo_5418293908006969232_w.jpg" style="display:none;">
<script>
  var ответ = "";
  while (ответ !== "1") {
    ответ = prompt("Напиши циферку 1");
    if (ответ !== "1") {
      alert("ПРОСТО ПИЗДЕЦ...1 надо писать");
    }
  }
  document.getElementById("tekst").textContent = "Мир, я тебя очень сильно люблю и решил сделать что-то приятное. Просто помни, что неважно, где я и сколько работаю, я всегда хочу прийти домой и провести с тобой время. Люблю💖";
  document.getElementById("foto").style.display = "inline-block";
</script>
</body>
</html>
