<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Мой сайт</title>
</head>
<body>
<p id="tekst"></p>
<script>
  var ответ = "";
  while (ответ !== "1") {
    ответ = prompt("Нажми циферку 1 ");
    if (ответ !== "1") {
      alert("Я СКАЗАЛ 1");
    }
  }
  document.getElementById("tekst").textContent = "Здесь будет мой текст";
</script>
</body>
</html>
